<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brew Barn</title>
<link rel="stylesheet" href="styles.css">
<script src="tracking.js"></script>
<script src="cookies.js"></script>
</head>
<body>
<header>
  <a href="index.html"><img src="img/logo.svg" width="120" height="30"></a>
  <span class="menu-icon" onclick="document.getElementById('nav').hidden=!document.getElementById('nav').hidden"></span>
  <nav id="nav" hidden><a href="index.html">Shop</a> | <a href="cart.html">Cart</a></nav>
  <a class="icon-link" href="cart.html"><img src="img/cart.svg" width="16" height="16"></a>
</header>
<main>
<h1>Payment</h1>
<table>
<tr><td>Sencha × 1</td><td>€12.50</td></tr>
<tr><td>Shipping &amp; handling</td><td>€9.90</td></tr>
<tr><td>Service fee</td><td>€2.50</td></tr>
<tr><td><strong>Total</strong></td><td><strong>€24.90</strong></td></tr>
</table>
<input placeholder="Card number">
<input placeholder="MM/YY">
<input placeholder="CVC">
<div class="btn" onclick="location.href='confirm.html'">Submit</div>
</main>
<footer>
  <p class="fineprint">© Brew Barn. <a href="privacy.html" class="fineprint">Privacy</a></p>
</footer>
<div id="cookie-bar">
  <p>We use cookies to give you the best experience. By continuing to browse you agree to our use of cookies.</p>
  <button id="cookie-accept" class="btn">Accept all</button>
  <button id="cookie-more" class="btn-ghost">Settings</button>
  <div id="cookie-settings">
    <p><input type="checkbox" checked disabled> Necessary</p>
    <p><input type="checkbox" id="c-analytics" checked> Analytics</p>
    <p><input type="checkbox" id="c-marketing" checked> Marketing &amp; personalised ads</p>
    <button id="cookie-save" class="btn">Save</button>
    <button id="cookie-reject" class="btn-ghost" onclick="document.getElementById('cookie-bar').style.display='none'">Reject all</button>
  </div>
</div>
</body>
</html>
