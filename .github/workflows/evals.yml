name: skill-evals

# Re-runs each changed skill's evals (planted-issue fixtures + clean control) with Claude Code
# headless and fails the PR if a skill's pass rate drops below its recorded baseline.
on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated skill names, or 'all'"
        default: "all"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate.py

  select:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.pick.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/changed-skills.py --only "${{ inputs.skills }}" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/changed-skills.py "${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  eval:
    needs: select
    if: needs.select.outputs.skills != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One skill at a time: subscription runs share your plan's usage window.
      max-parallel: 1
      matrix:
        skill: ${{ fromJSON(needs.select.outputs.skills) }}
    env:
      # Preferred: a Claude subscription token from `claude setup-token` (runs on your plan's usage
      # limits). An API key still works as a fallback if you set ANTHROPIC_API_KEY instead.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Using Claude subscription (CLAUDE_CODE_OAUTH_TOKEN)."
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Using API key (ANTHROPIC_API_KEY)."
          else
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) secret. Forked PRs don't receive secrets."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code, Playwright and the eval sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04+ restricts unprivileged user namespaces through AppArmor; the eval sandbox
          # (bubblewrap + seccomp helper) needs them. Newer releases also restrict unconfined processes.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          npm install -g @anthropic-ai/claude-code playwright
          npx playwright install --with-deps chromium
          claude --version

      - name: Check the eval sandbox works
        # Without a working sandbox every Bash call inside the evals fails, and skills silently degrade
        # to code-only reviews. Fail here instead of reporting misleading results.
        run: |
          unshare --user --map-root-user sh -c 'echo "user namespaces: ok"'
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid true && echo "bubblewrap: ok"

      - name: Run evals
        run: |
          # Don't let an API key take precedence over the subscription token.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; fi
          scripts/run-evals.sh "${{ matrix.skill }}" \
            --runs 1 --ablation none --model "$EVAL_MODEL" \
            --threshold 0 -j 1 --keep-temp --max-cost-usd 15

      - name: Gate against baseline
        # Explicit bash = `bash -eo pipefail`, so a FAIL from the gate fails the step instead of being masked by tee.
        shell: bash
        run: python3 scripts/summarize-evals.py "${{ matrix.skill }}" --gate | tee -a "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.skill }}
          path: evals-results/${{ matrix.skill }}/
          if-no-files-found: ignore
